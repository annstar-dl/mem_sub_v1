<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="980" viewBox="0 0 1800 980">
  <defs>
    <style>
      .title{font:700 26px Arial, sans-serif;fill:#222}
      .txt{font:14px Arial, sans-serif;fill:#222}
      .small{font:12px Arial, sans-serif;fill:#333}
      .box{rx:12;ry:12;stroke-width:2}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#444"/>
    </marker>
  </defs>

  <text x="24" y="40" class="title">Membrane Subtraction Workflow (Entry: scripts/seg_subtract_desktop.sh)</text>
  <text x="24" y="70" class="txt">Flat SVG fallback for Microsoft 365 Visio import</text>

  <rect x="40" y="110" width="280" height="90" class="box" fill="#dae8fc" stroke="#6c8ebf"/>
  <text x="55" y="140" class="txt">1) Initialize environment</text>
  <text x="55" y="162" class="small">scripts/seg_subtract_desktop.sh</text>

  <rect x="380" y="110" width="360" height="90" class="box" fill="#d5e8d4" stroke="#82b366"/>
  <text x="395" y="140" class="txt">2) Segment membrane masks</text>
  <text x="395" y="162" class="small">scripts/seg_subtract_v1.sh + scripts/seg_mrc.sh</text>

  <rect x="800" y="110" width="360" height="90" class="box" fill="#ffe6cc" stroke="#d79b00"/>
  <text x="815" y="140" class="txt">3) Subtract membrane + export outputs</text>
  <text x="815" y="162" class="small">tools/run_mrc_subtraction.py</text>

  <line x1="320" y1="155" x2="380" y2="155" stroke="#444" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="740" y1="155" x2="800" y2="155" stroke="#444" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="24" y="250" class="txt">Detail flow (script/function level)</text>
  <rect x="40" y="270" width="520" height="300" class="box" fill="#f8cecc" stroke="#b85450"/>
  <text x="58" y="300" class="txt">scripts/seg_subtract_desktop.sh</text>
  <text x="58" y="330" class="small">- Parse IMGPATH, SAVEDIR, optional segdir</text>
  <text x="58" y="355" class="small">- Set SAVE_ANGLE=1, SAVE_SUB=1</text>
  <text x="58" y="380" class="small">- Export SEGMENTATION_DIR if segdir provided</text>
  <text x="58" y="405" class="small">- Build LD_LIBRARY_PATH for conda/nvidia libs</text>
  <text x="58" y="430" class="small">- Export SAVEDIR/SAVE_* and call seg_subtract_v1.sh</text>

  <rect x="620" y="270" width="550" height="360" class="box" fill="#e1d5e7" stroke="#9673a6"/>
  <text x="638" y="300" class="txt">scripts/seg_subtract_v1.sh</text>
  <text x="638" y="330" class="small">- Normalize/create SAVEDIR; detect directory vs file input</text>
  <text x="638" y="355" class="small">- Run nvidia-smi</text>
  <text x="638" y="380" class="small">- Call scripts/seg_mrc.sh with IMGPATH and ${SAVEDIR}/misc</text>
  <text x="638" y="405" class="small">- Branch on SAVE_ANGLE/SAVE_SUB flags</text>
  <text x="638" y="430" class="small">- Run tools/run_mrc_subtraction.py with matching output flags</text>

  <rect x="40" y="610" width="520" height="300" class="box" fill="#d5e8d4" stroke="#82b366"/>
  <text x="58" y="640" class="txt">scripts/seg_mrc.sh</text>
  <text x="58" y="670" class="small">- Validate args (MRC_PATH, SAVE_DIR)</text>
  <text x="58" y="695" class="small">- Resolve SEGMENTATION_DIR (arg or default)</text>
  <text x="58" y="720" class="small">- Determine directory vs single .mrc mode</text>
  <text x="58" y="745" class="small">- tools/mrc2image.py converts MRC to JPG</text>
  <text x="58" y="770" class="small">- membrane_seg/seg_onnx.py generates masks</text>

  <line x1="560" y1="420" x2="620" y2="420" stroke="#444" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="900" y1="630" x2="300" y2="610" stroke="#444" stroke-width="2" marker-end="url(#arrow)"/>
</svg>
